<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tight Secure - Password Security Tool</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="vault-container">
        <header class="vault-header">
            <h1>Tight Secure</h1>
            <p>Zero-Knowledge Architecture: 100% client-side processing. No data is sent to a server.</p>
        </header>

        <!-- Tab Navigation -->
        <div class="tabs">
            <button class="tab-btn active" data-target="generator-view">Generator</button>
            <button class="tab-btn" data-target="analyzer-view">Analyzer</button>
        </div>

        <!-- GENERATOR VIEW -->
        <section id="generator-view" class="view-section active">
            <div class="output-group">
                <input type="text" id="generated-password" class="mono-input" readonly placeholder="Your password will appear here">
                <button id="copy-btn" class="action-btn" title="Copy to Clipboard">📋 Copy</button>
                <button id="regenerate-btn" class="action-btn" title="Regenerate">🔄</button>
            </div>

            <div class="controls-group">
                <div class="slider-group">
                    <label for="length-slider">Length: <span id="length-display">16</span></label>
                    <input type="range" id="length-slider" min="8" max="128" value="16">
                </div>

                <div class="checkbox-group">
                    <label class="check-label">
                        <input type="checkbox" id="check-upper" checked> Uppercase (A-Z)
                    </label>
                    <label class="check-label">
                        <input type="checkbox" id="check-lower" checked> Lowercase (a-z)
                    </label>
                    <label class="check-label">
                        <input type="checkbox" id="check-numbers" checked> Numbers (0-9)
                    </label>
                    <label class="check-label">
                        <input type="checkbox" id="check-symbols" checked> Symbols (!@#$%^&*)
                    </label>
                </div>
            </div>
        </section>

        <!-- ANALYZER VIEW -->
        <section id="analyzer-view" class="view-section">
            <div class="input-group">
                <input type="password" id="analyze-input" class="mono-input" placeholder="Type or paste a password...">
                <button id="toggle-visibility" class="action-btn">👁️</button>
            </div>

            <div class="meter-container">
                <div id="strength-meter" class="meter-fill"></div>
            </div>
            
            <div class="status-group">
                <h3 id="strength-text">Awaiting Input</h3>
                <p id="crack-time">Estimated time to crack: --</p>
            </div>

            <ul class="checklist">
                <li id="req-length" class="req-item">❌ At least 8 characters</li>
                <li id="req-upper" class="req-item">❌ Contains Uppercase</li>
                <li id="req-number" class="req-item">❌ Contains Number</li>
                <li id="req-symbol" class="req-item">❌ Contains Symbol</li>
            </ul>
        </section>
    </main>

    <script src="js/app.js"></script>
    <script src="js/generator.js"></script>
    <script src="js/analyzer.js"></script>
</body>
</html>
